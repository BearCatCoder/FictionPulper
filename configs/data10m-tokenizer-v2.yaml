seed: 1337

model:
  vocab_size: 4096
  hidden_size: 256
  num_layers: 6
  num_attention_heads: 8
  num_key_value_heads: 2
  intermediate_size: 736
  max_seq_len: 1024
  activation: swiglu
  normalization: rmsnorm
  positional_encoding: rope
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false

tokenizer:
  type: BPE
  vocab_size: 4096
  path: data/tokenizer/data10m-v2/tokenizer.json
  expected_sha256: 108677dabadfb2888d4f8247b9377f5c074559414421b0245bd5896a9527b3c9

training:
  optimizer: adamw
  batch_size: 16
  gradient_accumulation_steps: 4
