  max_steps: 1430
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  warmup_steps: 72
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  checkpoint_dir: checkpoints/fictionpulper-5m-data10m-tokenizer-v2

