  packed_metadata_path: data/packed/corpus-v1-tokenizer-v2/metadata.json
  train_path: data/packed/corpus-v1-tokenizer-v2/train.bin
  validation_path: data/packed/corpus-v1-tokenizer-v2/validation.bin
  test_path: data/packed/corpus-v1-tokenizer-v2/test.bin
